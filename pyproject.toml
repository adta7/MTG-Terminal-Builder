[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-deckbuilding-companion"
version = "0.1.0"
description = "Terminal tool for Magic: The Gathering deck building and collection management"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Albert Yan", email = "yan.albert.us@gmail.com" },
]
dependencies = [
    "rich>=13.0.0",
    "pandas>=1.3.0",
    "openpyxl>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
mtgdeck = "mtgdeck.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
