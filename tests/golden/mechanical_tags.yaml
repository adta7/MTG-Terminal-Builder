# Golden Test Set: Expected Mechanical Tags
#
# This YAML file defines the source of truth for mechanical tag expectations.
# Every card listed here has been manually verified to have the correct tags.
#
# Format:
#   card_name:
#     must_have:
#       - Tag1
#       - Tag2
#     must_not_have:
#       - WrongTag1
#       - WrongTag2
#
# Both must_have and must_not_have are important:
# - must_have ensures we don't miss tags
# - must_not_have catches false positives and semantic errors
#
# Organized by mechanic family for easier review.

---

